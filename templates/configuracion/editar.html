{% extends "base.html" %}
{% block title %}Configuración - Parri{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white py-3">
                <h5 class="mb-0"><i class="bi bi-gear me-2"></i>Configuración del Ticket</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label for="mensaje_ticket" class="form-label fw-semibold">
                            Mensaje al pie del ticket
                        </label>
                        <textarea class="form-control" id="mensaje_ticket" name="mensaje_ticket" rows="3" maxlength="200" placeholder="Ej: Gracias por su visita">{{ mensaje_ticket }}</textarea>
                        <div class="form-text">Este mensaje se imprimirá al final de cada pre-cuenta y comprobante.</div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-dark rounded-pill px-4">
                            <i class="bi bi-check-lg me-1"></i> Guardar
                        </button>
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary rounded-pill px-4">
                            <i class="bi bi-x-lg me-1"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
